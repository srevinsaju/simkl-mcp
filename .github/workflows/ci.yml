name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # generated/tools.ts is gitignored but required by the typecheck
      - run: bun run codegen

      - run: bun run typecheck

      - run: bun test --pass-with-no-tests
