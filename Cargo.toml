[workspace]
resolver = "3"
members = ["crates/simkl-api", "crates/simkl-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/srevinsaju/simkl-mcp"

[workspace.dependencies]
simkl-api = { path = "crates/simkl-api" }

anyhow = "1"
axum = "0.8"
bon = "3"
clap = { version = "4", features = ["derive", "env"] }
derive_more = { version = "2", features = ["as_ref", "display", "from", "into"] }
garde = { version = "0.23", features = ["derive", "regex"] }
governor = "0.10"
indexmap = { version = "2", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
moka = { version = "0.12", features = ["future"] }
oauth2 = { version = "5", default-features = false }
oauth-as = { version = "1", features = ["http", "axum", "jwt", "jwt-ed25519", "cimd", "resource-metadata"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
