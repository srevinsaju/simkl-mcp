<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The link-preview image: name and tagline over simkl-mcp's navy, above a chat that uses it.
       The screenshot is docs/screenshots/title.png, drawn 760 wide on its own background colour (#191919),
       in a window that runs off the bottom edge. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#4b6a88"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.5" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
    <filter id="window-shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="40" stdDeviation="45" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="icon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="window">
      <rect x="80" y="212" width="1040" height="460" rx="22"/>
    </clipPath>
    <clipPath id="icon">
      <rect x="80" y="52" width="56" height="56" rx="13"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <rect x="80" y="52" width="56" height="56" rx="13" fill="#ffffff" filter="url(#icon-shadow)"/>
  <image x="80" y="52" width="56" height="56" clip-path="url(#icon)" xlink:href="simkl-logo.png"/>
  <text x="154" y="99" font-family="IBM Plex Sans" font-weight="600" font-size="52" letter-spacing="-0.5" fill="#ffffff">Simkl MCP</text>
  <text x="80" y="144" font-family="IBM Plex Sans" font-size="24" fill="#ffffff" fill-opacity="0.78">Your Simkl watchlist, history and ratings, in Claude.</text>

  <rect x="80" y="212" width="1040" height="460" rx="22" fill="#191919" filter="url(#window-shadow)"/>
  <g clip-path="url(#window)">
    <rect x="80" y="212" width="1040" height="460" fill="#191919"/>
    <image x="220" y="236" width="760" height="425" preserveAspectRatio="xMidYMin meet" xlink:href="../../../docs/screenshots/title.png"/>
  </g>
  <rect x="80.5" y="212.5" width="1039" height="459" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
</svg>
