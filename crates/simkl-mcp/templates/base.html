<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}simkl-mcp{% endblock %}</title>
    <link rel="icon" href="https://simkl.com/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
{% include "tokens.css" %}

        /* A permission sheet: the two apps, one row per permission, then the
           decision. */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font: 15px/1.55 var(--font-sans);
            background: var(--color-background-secondary);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
        }

        .sheet {
            width: 100%;
            max-width: 400px;
            background: var(--color-background-primary);
            border: 1px solid var(--color-border-primary);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            padding: 28px 24px 22px;
            display: grid;
            gap: 20px;
        }

        .apps { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .app {
            width: 44px;
            height: 44px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            font-weight: 600;
            border: 1px solid var(--color-border-primary);
            background: var(--color-background-secondary);
        }
        .app.simkl { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
        .link { width: 40px; border-top: 2px dotted var(--color-border-primary); }

        .mark {
            justify-self: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 20px;
            font-weight: 600;
            background: var(--color-background-tertiary);
        }
        .mark.danger { color: var(--color-text-danger); }

        h1 { font-size: 18px; line-height: 1.3; font-weight: 600; text-align: center; text-wrap: balance; }
        .sub { margin-top: -12px; text-align: center; font-size: 13.5px; color: var(--color-text-secondary); }

        .scopes { list-style: none; border: 1px solid var(--color-border-primary); border-radius: var(--border-radius-md); }
        .scopes li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 14px; font-size: 14px; }
        .scopes li + li { border-top: 1px solid var(--color-border-primary); }
        .scopes small { display: block; font-size: 12.5px; color: var(--color-text-secondary); }
        .icon {
            width: 22px;
            height: 22px;
            border-radius: var(--border-radius-sm);
            display: grid;
            place-items: center;
            font: 600 12px var(--font-mono);
            background: var(--color-background-tertiary);
        }
        .icon.read { color: var(--color-text-success); }
        .icon.write { color: var(--color-text-warning); }

        .actions { display: flex; gap: 10px; }
        button {
            flex: 1;
            font: 500 14px var(--font-sans);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: var(--accent-text);
            cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }
        button.secondary { background: transparent; color: var(--color-text-primary); border-color: var(--color-border-primary); }
        button.secondary:hover { filter: none; background: var(--color-background-secondary); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .foot { text-align: center; font: 12px/1.5 var(--font-mono); color: var(--color-text-secondary); overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main class="sheet">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
