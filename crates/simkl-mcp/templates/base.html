<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}simkl-mcp{% endblock %}</title>
    <link rel="icon" href="https://simkl.com/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* The terminal-window theme of wanikani-mcp and simkl-mcp's landing
           page (static/index.html), in simkl-mcp's navy. */
        :root {
            --color-primary: #2C3E50;
            --color-primary-dark: #1A252F;
            --color-bg: #F4F4F4;
            --color-surface: #FFFFFF;
            --color-border: #E0E0E0;
            --color-text: #333333;
            --color-text-muted: #767676;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fira Code', monospace;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            background: var(--color-surface);
            border: 2px solid var(--color-border);
            max-width: 520px;
            width: 100%;
        }

        .terminal-header {
            background: var(--color-primary);
            padding: 12px 16px;
            border-bottom: 2px solid var(--color-primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--color-primary-dark);
        }

        .terminal-title {
            margin-left: auto;
            color: var(--color-surface);
            font-size: 12px;
        }

        .content { padding: 32px; }

        h1 { font-size: 20px; margin-bottom: 8px; font-weight: 700; }
        h1::before { content: "⚡ "; }

        .subtitle { color: var(--color-text-muted); margin-bottom: 24px; font-size: 13px; }

        .client-info, .info-box {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .client-info p + p { margin-top: 8px; }
        .client-info code { color: var(--color-primary); font-weight: 500; }
        .info-box::before { content: "ℹ "; color: var(--color-primary); margin-right: 4px; }

        .actions { display: flex; gap: 12px; }

        button {
            flex: 1;
            padding: 12px 24px;
            background: var(--color-primary);
            color: var(--color-surface);
            border: 2px solid var(--color-primary);
            font-size: 14px;
            font-weight: 500;
            font-family: 'Fira Code', monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }

        button.secondary { background: var(--color-surface); color: var(--color-primary); }
        button.secondary:hover { background: var(--color-bg); }
    </style>
</head>
<body>
    <main class="container">
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">{% block window %}simkl-mcp{% endblock %}</div>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
